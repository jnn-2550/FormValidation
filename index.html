<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form name="myForm">
      Email:
      <input type="email"name="email"autocomplete="off"id="email">
       <span class="error hide">Please enter a valid email address</span>
    <br>
      Password:
      <input type="password"name="password" autocomplete="off"id="password">
       <span class="error hide">Password must be 3-8 characters long and contain only letters and numbers</span>
    <br>
      User Name:
      <input type="text"name="userName"id="userName" autocomplete="off">
       <span class="error hide">Username cannot be empty</span>
    <br>
    <input type="submit"value="Sign Up"id='submit'>
  </form>
  <script src="script.js"> </script>
  
</body>
</html>
